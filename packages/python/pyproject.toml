[project]
name = "jobpulse-core"
version = "0.1.0"
description = "JobPulse pure domain logic: sources, eligibility, ranking, intelligence, notifications"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.13.5",
    "httpx>=0.28.1",
    "selectolax>=1.0.0",
    "feedparser>=6.0.14",
    "nh3>=0.3.7",
    "openai>=3.24.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.63.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpulse_core"]

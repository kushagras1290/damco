[project]
name = "jobpulse-core"
version = "0.1.0"
description = "JobPulse pure domain logic: sources, eligibility, ranking, intelligence, notifications"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.13",
    "httpx>=0.28",
    "selectolax>=0.4",
    "feedparser>=6.0",
    "nh3>=0.3",
    "openai>=3.22",
    "pyyaml>=6.0",
    "structlog>=26.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.63"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpulse_core"]

[project]
name = "jobpulse-worker"
version = "0.1.0"
description = "JobPulse Temporal worker"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jobpulse-core",
    "jobpulse-api",
    "temporalio>=1.33",
    "structlog>=26.1",
]

[project.scripts]
jobpulse-worker = "jobpulse_worker.runtime.main:run"

[tool.uv.sources]
jobpulse-core = { workspace = true }
jobpulse-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpulse_worker"]

[project]
name = "jobpulse-api"
version = "0.1.0"
description = "JobPulse FastAPI service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jobpulse-core",
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "psycopg[binary,pool]>=3.3",
    "alembic>=1.20",
    "pgvector>=0.5",
    "structlog>=26.1",
    "temporalio>=1.33",
    "pyjwt[crypto]>=2.15",
    "prometheus-client>=0.26",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "sentry-sdk[fastapi]>=2.71",
    "boto3>=1.43",
]

[tool.uv.sources]
jobpulse-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpulse"]

[project]
name = "jobpulse-api"
version = "0.1.0"
description = "JobPulse FastAPI service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jobpulse-core",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "psycopg[binary,pool]>=3.3.6",
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
    "structlog>=26.1.0",
    "temporalio>=1.34.0",
    "pyjwt>=2.15.1",
    "prometheus-client>=0.26.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "sentry-sdk[fastapi]>=2.71.0",
    "boto3>=1.43.108",
]

[tool.uv.sources]
jobpulse-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpulse"]

# Render Blueprint: API web service + Temporal background worker, both pulled as prebuilt
# images pushed to GHCR by .github/workflows/deploy.yml (which then triggers each deploy).
# Neon, Temporal Cloud, R2 and Resend are external; supply their secrets in the dashboard.
# Redis (rate limits, cache, idempotency) is a Render Key Value instance wired in below.
# If the GHCR packages are private, add a registry credential named `ghcr` in Render.

services:
  - type: web
    name: jobpulse-api
    runtime: image
    image:
      url: ghcr.io/kushagras1290/damco/jobpulse-api:latest
    plan: starter
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - { key: ENVIRONMENT, value: production }
      - { key: STORAGE_BACKEND, value: r2 }
      - { key: TEMPORAL_TLS, value: "true" }
      # Render terminates TLS in one proxy hop (and injects PORT, honoured by jobpulse.serve).
      - { key: TRUSTED_PROXY_COUNT, value: "1" }
      - { key: FORWARDED_ALLOW_IPS, value: "*" }
      - { key: DATABASE_URL, sync: false }
      # Direct (unpooled) Neon URL for LISTEN/NOTIFY realtime events.
      - { key: DATABASE_LISTEN_URL, sync: false }
      - { key: API_JWT_JWKS, sync: false }
      - { key: OWNER_GITHUB_IDS, sync: false }
      # open | invite | closed - start invite-only until billing is live.
      - { key: SIGNUP_POLICY, value: invite }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: jobpulse-redis, property: connectionString }
      - { key: TEMPORAL_ADDRESS, sync: false }
      - { key: TEMPORAL_NAMESPACE, sync: false }
      - { key: TEMPORAL_API_KEY, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: R2_ACCOUNT_ID, sync: false }
      - { key: R2_ACCESS_KEY_ID, sync: false }
      - { key: R2_SECRET_ACCESS_KEY, sync: false }
      - { key: R2_BUCKET, sync: false }
      - { key: SENTRY_DSN, sync: false }

  - type: worker
    name: jobpulse-worker
    runtime: image
    image:
      url: ghcr.io/kushagras1290/damco/jobpulse-worker:latest
    plan: starter
    autoDeploy: false
    envVars:
      - { key: ENVIRONMENT, value: production }
      - { key: STORAGE_BACKEND, value: r2 }
      - { key: TEMPORAL_TLS, value: "true" }
      - { key: DATABASE_URL, sync: false }
      - { key: API_JWT_JWKS, sync: false }
      - { key: OWNER_GITHUB_IDS, sync: false }
      - { key: TEMPORAL_ADDRESS, sync: false }
      - { key: TEMPORAL_NAMESPACE, sync: false }
      - { key: TEMPORAL_API_KEY, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: R2_ACCOUNT_ID, sync: false }
      - { key: R2_ACCESS_KEY_ID, sync: false }
      - { key: R2_SECRET_ACCESS_KEY, sync: false }
      - { key: R2_BUCKET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: NOTIFICATION_FROM_EMAIL, sync: false }
      - { key: WEBHOOK_SIGNING_SECRET, sync: false }
      - { key: DASHBOARD_BASE_URL, sync: false }
      - { key: SENTRY_DSN, sync: false }

  - type: keyvalue
    name: jobpulse-redis
    plan: starter
    # Every key JobPulse writes has a TTL; evict only those under memory pressure.
    maxmemoryPolicy: volatile-lru
    # Private network only: no public access.
    ipAllowList: []

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.3"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  python:
    name: Python · lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: jobpulse
          POSTGRES_PASSWORD: jobpulse
          POSTGRES_DB: jobpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobpulse" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JOBPULSE_TEST_DATABASE_URL: postgresql+psycopg://jobpulse:jobpulse@localhost:5432/jobpulse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (mypy --strict)
        run: uv run mypy packages/python/src apps/api/src apps/worker/src
      - name: Migrations are reversible
        env:
          DATABASE_URL: ${{ env.JOBPULSE_TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests (unit, contract, integration, workflow)
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: pip-audit (locked third-party dependencies)
        run: |
          uv export --frozen --all-packages --no-emit-workspace --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --strict --progress-spinner off

  web:
    name: Web · lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build  # needs no secrets: all config is read at request time
      - run: pnpm audit --prod --audit-level high

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep
        run: pipx run semgrep scan --config p/default --config p/python --config p/typescript --error --metrics off
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  images:
    name: Container build + scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, web]
    strategy:
      matrix:
        include:
          - { name: api, file: infra/docker/python.Dockerfile, target: api, context: . }
          - { name: worker, file: infra/docker/python.Dockerfile, target: worker, context: . }
          - { name: web, file: infra/docker/web.Dockerfile, target: runtime, context: apps/web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          tags: jobpulse-${{ matrix.name }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jobpulse-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

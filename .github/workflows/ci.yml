name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.3"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  python:
    name: Python · lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: jobpulse
          POSTGRES_PASSWORD: jobpulse
          POSTGRES_DB: jobpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobpulse" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JOBPULSE_TEST_DATABASE_URL: postgresql+psycopg://jobpulse:jobpulse@localhost:5432/jobpulse
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (mypy --strict)
        run: uv run mypy packages/python/src apps/api/src apps/worker/src
      - name: Migrations are reversible
        env:
          DATABASE_URL: ${{ env.JOBPULSE_TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests (unit, contract, integration, workflow)
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: pip-audit
        run: uv run pip-audit --strict --progress-spinner off

  web:
    name: Web · lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          API_JWT_SECRET: ci-build-placeholder-not-a-secret-0000000
          AUTH_SECRET: ci-build-placeholder-not-a-secret-0000000
      - run: pnpm audit --prod --audit-level high

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep
        run: pipx run semgrep scan --config p/default --config p/python --config p/typescript --error --metrics off
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  images:
    name: Container build + scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, web]
    strategy:
      matrix:
        include:
          - { name: api, file: infra/docker/python.Dockerfile, target: api, context: . }
          - { name: worker, file: infra/docker/python.Dockerfile, target: worker, context: . }
          - { name: web, file: infra/docker/web.Dockerfile, target: runtime, context: apps/web }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          tags: jobpulse-${{ matrix.name }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: jobpulse-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
